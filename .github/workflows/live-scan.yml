# NSE cash hours, Mon–Fri. GitHub’s scheduler minimum is 5 minutes and it
# can still slip under load — this is a heartbeat, not a live feed.
# Lowest delay: `python -m nse_scanner live` on a VPS in India.
#
# Crons are 2 minutes AFTER each 5m close (IST) so (1) Yahoo has published
# the bar and (2) we avoid the :00/:05 UTC stampede that delays jobs.
# Late runs and old Yahoo candles are discarded by MAX_ALERT_LAG_SECONDS.
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

name: NSE 5m live scan

on:
  workflow_dispatch:
  schedule:
    # 09:22, 09:27 IST (09:15 / 09:20 bars closed)
    - cron: "52,57 3 * * 1-5"
    # 09:32–15:27 IST every 5m
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 4-9 * * 1-5"
    # 15:32 IST (15:25 bar closed)
    - cron: "2 10 * * 1-5"

concurrency:
  group: nse-live-scan
  # Serialize runs: cancelling after a Telegram POST but before saving state
  # can cause a duplicate on the next run. Late queued runs self-discard.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: IST date
        id: ist
        run: echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      # Cache keys are IMMUTABLE. A fixed date key restores the *first* run's
      # state forever and repeats its alerts every 5m. Use one key per run,
      # restoring the most recently created cache from this IST session.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: state/scan_state.json
          key: nse-scan-state-${{ steps.ist.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-scan-state-${{ steps.ist.outputs.day }}-
            nse-scan-state-
          # The second prefix restores the last session's open EMA9 trails.
          # reset_if_new_day clears sent entries but keeps open positions.

      - name: Scan last 5m bar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          MAX_ALERT_LAG_SECONDS: "180"
        # workflow_dispatch also fires at the exact UTC 5m boundary on this
        # repo. Yahoo's closed candle may not yet be published on first fetch;
        # retry only until the fixed freshness deadline, never replay old bars.
        run: python -m nse_scanner once --wait-for-bar

      # A corrupt ledger must not turn into another immutable cache snapshot.
      # Validate even if the scan failed after successfully sending a message:
      # in that case save the good ledger to prevent a duplicate next run.
      - name: Validate scanner state
        id: validate
        if: ${{ !cancelled() && hashFiles('state/scan_state.json') != '' }}
        run: python -c 'from nse_scanner.state import load; load()'

      - name: Save updated scanner state
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: state/scan_state.json
          key: nse-scan-state-${{ steps.ist.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
