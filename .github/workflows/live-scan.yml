# NSE live scanner — ONE long-running job per session, not one job per candle.
#
# Why: a job-per-candle design can never be early. Each run has to be triggered
# (the external dispatcher fired 65s after the close, and since 10 Nov only once
# an hour), boot a runner and reinstall Python (~20s) before it even asks Yahoo
# for the candle. The loop below is already running when the candle closes, and
# it also looks at the FORMING candle 60s before the close (early alerts).
#
# Every trigger is only a "make sure the loop is alive" signal:
#   * loop already running  -> the guard job exits in seconds, nothing is sent
#   * loop not running      -> this run becomes the loop
# A job may not run for more than 6h, so the loop hands over to a fresh run
# every 170 minutes (state is saved first, then the successor is dispatched).
# If a run dies, the next trigger restarts it — keep the hourly dispatcher.
#
# Required secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Optional mirror: TELEGRAM_BOT_TOKEN_2, TELEGRAM_CHAT_ID_2

name: NSE 5m live scan
# The guard recognises dry runs by this title and does not count them as the loop.
run-name: ${{ inputs.dry_run && 'DRY RUN - NSE live scan' || 'NSE 5m live scan' }}

on:
  workflow_dispatch:
    inputs:
      handoff:
        description: "Planned takeover from a run that reached its time budget"
        type: boolean
        default: false
      dry_run:
        description: "Print alerts to the log instead of sending them to Telegram"
        type: boolean
        default: false
  schedule:
    # GitHub's scheduler has been hours late on this repo, so these are only a
    # backup for the external dispatcher. 09:07 IST start + half-hourly checks.
    - cron: "37 3 * * 1-5"
    - cron: "7,37 4-9 * * 1-5"

permissions:
  contents: read
  actions: write   # list runs (guard) and dispatch the successor (handover)

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is a scanner loop already running?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Outside the session there is nothing to start.
          now=$(TZ=Asia/Kolkata date +%u%H%M)
          dow=${now:0:1}; hm=$((10#${now:1}))
          if [ "$dow" -gt 5 ] || [ "$hm" -lt 830 ] || [ "$hm" -ge 1533 ]; then
            echo "outside NSE session (IST $now) - nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A dry run sends nothing and keeps its own throw-away ledger, so it
          # may run beside the real loop (that is the only time it is useful).
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run - starting next to any live loop"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only OLDER runs count, so two simultaneous triggers cannot both
          # stand down. An older run that is itself just a guard (or a loop
          # that is handing over) finishes within seconds: wait it out. One
          # that is still active after 2 minutes is the live loop.
          answered=false
          for i in $(seq 1 24); do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live-scan.yml/runs?per_page=40" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id < $GITHUB_RUN_ID and ((.display_title // \"\") | startswith(\"DRY RUN\") | not))] | length" || true)
            if [ "$busy" = "0" ]; then
              echo "no other run active - this run becomes the scanner loop"
              echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ -n "$busy" ]; then answered=true; fi
            sleep 5
          done
          if [ "$answered" = "false" ]; then
            # The API never answered, so we do not know. Starting is the safe
            # side: the scan job's concurrency group makes a second loop wait
            # for the first instead of running beside it.
            echo "could not list runs - starting; the concurrency group prevents a double loop"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "scanner loop already running ($busy older run active) - standing down"
          echo "run=false" >> "$GITHUB_OUTPUT"

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      # Belt and braces: two loops would double-send. Never cancel a running
      # loop (a Telegram POST may be in flight before its state is saved).
      group: nse-live-scan${{ inputs.dry_run && '-dry' || '' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The one thing the process cannot see: which variables are set in the
      # repository. `vars.*` is empty for a variable that was created as a
      # *secret*, and the workflow then supplies its default — so a knob you set
      # and a knob you did not look identical from inside the run. This prints
      # the repo's own variables before the loop starts.
      - name: Repository variables in force
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          echo "repository variables: ${REPO_VARS}"
          [ -n "${REPO_VARS}" ] || echo "none are set — every knob is at its workflow default"

      - name: IST date
        id: ist
        run: echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      # Cache keys are IMMUTABLE. A fixed date key restores the *first* run's
      # state forever and repeats its alerts every 5m. Use one key per run,
      # restoring the most recently created cache from this IST session.
      # Dry runs never read or write the real ledger snapshot: a copy saved by a
      # dry run would become the newest cache and be restored by the real loop.
      - name: Restore scanner state
        if: ${{ !inputs.dry_run }}
        uses: actions/cache/restore@v4
        with:
          path: state/scan_state.json
          key: nse-scan-state-${{ steps.ist.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-scan-state-${{ steps.ist.outputs.day }}-
            nse-scan-state-
          # The second prefix restores today's ledger (an open EMA9 trail after
          # a restart). A trade is intraday: reset_if_new_day drops positions
          # entered on an earlier session instead of trailing them on today's bars.

      - name: Live loop (early pass before each 5m close, confirm after it)
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bot 4 is the screen's own channel: setups, never entries.
          TELEGRAM_BOT_TOKEN_4: ${{ secrets.TELEGRAM_BOT_TOKEN_4 }}
          TELEGRAM_CHAT_ID_4: ${{ secrets.TELEGRAM_CHAT_ID_4 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          LOG_LEVEL: INFO
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Seconds before each 5m close at which the forming candle is judged
          # and an "EARLY (unconfirmed)" alert may be sent. 0 = close-only.
          EARLY_ALERT_SECONDS: "60"
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
          # An unset variable is the empty string here, so every one that has a
          # code default is given one explicitly: "" and "unset" must not be two
          # different configurations. Both loops log the values they received.
          SECTOR_FOLLOW: ${{ vars.SECTOR_FOLLOW || '1' }}       # "0" = NEUTRAL market always WAITs
          SF_ALIGNED_SECTORS: ${{ vars.SF_ALIGNED_SECTORS }}    # e.g. PHA,ENE - scanned first
          OI_FILTER: ${{ vars.OI_FILTER || 'annotate' }}        # off | annotate | require
          # The NEUTRAL-market follow fallback's two limits (README: 55 / 2).
          SECTOR_FOLLOW_MIN_PERSIST: ${{ vars.SECTOR_FOLLOW_MIN_PERSIST || '75' }}
          SECTOR_FOLLOW_MAX: ${{ vars.SECTOR_FOLLOW_MAX || '2' }}
          SECTOR_EXTRA_MAX: ${{ vars.SECTOR_EXTRA_MAX || '1' }}
          TRIPLE_PICK: ${{ vars.TRIPLE_PICK || '1' }}
          ENTRY_MIN_RANK: ${{ vars.ENTRY_MIN_RANK || '40' }}
          ENTRY_RANK_BAND: ${{ vars.ENTRY_RANK_BAND || '0.75' }}
          TRIPLE_MIN_PERSIST: ${{ vars.TRIPLE_MIN_PERSIST || '85' }}
          NAME_RANK: ${{ vars.NAME_RANK || 'combined' }}
          EOD_REPORT: ${{ vars.EOD_REPORT || '1' }}
          # 1 = also upload the day's JSON audit and XLSX workbook.
          EOD_AUDIT: ${{ vars.EOD_AUDIT || '1' }}
          EOD_MAX_CHARS: ${{ vars.EOD_MAX_CHARS || '3800' }}
          AUDIT_DIR: ${{ vars.AUDIT_DIR || 'reports' }}
          # The trader ledger's money: all-in cost per side (bps of
          # turnover), the floor per order, and the notional per trade.
          COST_BPS: ${{ vars.COST_BPS || '5' }}
          COST_MIN: ${{ vars.COST_MIN || '20' }}
          TRADE_CAPITAL: ${{ vars.TRADE_CAPITAL || '100000' }}
          # An early print older than this is never shown as live (README: 100).
          EARLY_MAX_STALE_SECONDS: ${{ vars.EARLY_MAX_STALE_SECONDS || '100' }}
          # Seconds after the close before the confirmed scan asks Yahoo. 2, not
          # 10: bot 4's screen now runs at the TOP of the cycle, so this sleep was
          # the floor under a card's age — ten seconds of ours on top of the feed's.
          # Bot 1 loses nothing: _run_until_ready retries at 5s inside the deadline.
          POLL_GRACE_SECONDS: "2"
          # Right after the close a candle is judged only once the stock's feed
          # shows a print at/after the close; after this many seconds regardless.
          BAR_SETTLE_SECONDS: "45"
          MAX_ALERT_LAG_SECONDS: "180"
          # Alert quality (16 Nov feed). A block is also sent when market
          # confidence moves this many points, not only on a label change.
          MARKET_CONF_DELTA: ${{ vars.MARKET_CONF_DELTA || '10' }}
          # Entries allowed per pick (sector+side) per session, 0 = no cap; the
          # names that clear it are alerted most-ahead-of-sector first.
          MAX_ENTRIES_PER_PICK: ${{ vars.MAX_ENTRIES_PER_PICK || '0' }}
          # 1 = rank those names by how far they lead their own sector today
          # (stock move minus sector move from each session open), 0 = by score.
          RANK_BY_SECTOR_LEAD: ${{ vars.RANK_BY_SECTOR_LEAD || '1' }}
          # A sector index may trail the decision bar this many 5m bars and still
          # be picked (-1 = no check); a further-behind index is named on the block.
          SECTOR_MAX_LAG_BARS: ${{ vars.SECTOR_MAX_LAG_BARS || '2' }}
          # How far (pp) a sector may lag Nifty and still complement the pick.
          PICK_RS_MARGIN: ${{ vars.PICK_RS_MARGIN || '0.05' }}
          # Persistence a sector needs before it may be picked at all (0 = no floor).
          PICK_MIN_PERSIST: ${{ vars.PICK_MIN_PERSIST || '50' }}
          # Points a challenger must beat the incumbent sector by to take the pick
          # (0 = switch on any margin).
          PICK_STICKY_MARGIN: ${{ vars.PICK_STICKY_MARGIN || '5' }}
          # 1 = a weak-but-directional BULL may still follow a plainly leading
          # sector (conf < 55). 0 = the locked rule: conf < 55 stands aside.
          SECTOR_FOLLOW_ON_WEAK: ${{ vars.SECTOR_FOLLOW_ON_WEAK || '0' }}
          SECTOR_FOLLOW_WEAK_MIN_PERSIST: ${{ vars.SECTOR_FOLLOW_WEAK_MIN_PERSIST || '85' }}
          # 1 = index up but breadth against it: the persistent faller may be
          # shorted (mirrored gates). 0 = the pick must agree with Nifty.
          DIVERGENCE_SHORT: ${{ vars.DIVERGENCE_SHORT || '0' }}
          DIVERGE_MIN_PERSIST: ${{ vars.DIVERGE_MIN_PERSIST || '65' }}
          # 1 = the persist floor rises as the confidence falls (50 at conf 70,
          # 65 at the conf-55 gate). 0 = a flat floor.
          PICK_CONF_SCALED_FLOOR: ${{ vars.PICK_CONF_SCALED_FLOOR || '0' }}
          PICK_LOWCONF_MIN_PERSIST: ${{ vars.PICK_LOWCONF_MIN_PERSIST || '65' }}
          # A pivot closer than this to entry is resistance, not a target.
          MIN_TARGET_R: ${{ vars.MIN_TARGET_R || '0.5' }}
          TARGET_FALLBACK: ${{ vars.TARGET_FALLBACK || '1' }}
          # 1 = no T1/T2/T3 at all means no entry (bot 3's rule). 17 Nov entered
          # HINDUNILVR (T2/T3 N/A) and DABUR (all three N/A) for -1.4R.
          SCAN5M_REQUIRE_TARGET: ${{ vars.SCAN5M_REQUIRE_TARGET || '1' }}
          # 1 = report a stock whose signal fired before its sector was picked,
          # while the trade is still valid. 18 Nov: CDUR was the pick from 09:45
          # with PERSIST - 93->99 and no CDUR stock was alerted all morning.
          SCAN5M_LEADER_CATCHUP: ${{ vars.SCAN5M_LEADER_CATCHUP || '1' }}
          SCAN5M_LEADER_MAX_MINUTES: ${{ vars.SCAN5M_LEADER_MAX_MINUTES || '40' }}
          LATE_LEADER_ENTRY: ${{ vars.LATE_LEADER_ENTRY || '1' }}
          LATE_LEADER_REBASE: ${{ vars.LATE_LEADER_REBASE || '1' }}
          SCAN5M_LEADER_MAX_R: ${{ vars.SCAN5M_LEADER_MAX_R || '2.0' }}
          PICK_CATCHUP: ${{ vars.PICK_CATCHUP || '1' }}
          SCAN1M_EARLY_FROM: ${{ vars.SCAN1M_EARLY_FROM || '09:30' }}
          AUDIT_BOARD: ${{ vars.AUDIT_BOARD || '1' }}
          AUDIT_BOARD_EVERY_MIN: ${{ vars.AUDIT_BOARD_EVERY_MIN || '5' }}
          AUDIT_BOARD_FROM: ${{ vars.AUDIT_BOARD_FROM || '09:20' }}
          AUDIT_BOARD_TO: ${{ vars.AUDIT_BOARD_TO || '15:15' }}
          AUDIT_BOARD_PERIOD: ${{ vars.AUDIT_BOARD_PERIOD || '1d' }}
          # ── bot 4 · the name-first screen ─────────────────────────────────
          # A short list of setups (both sides) that the human chooses from. It
          # never enters: no position, no money, its own ledger and its own bot.
          SCREEN_BOT: ${{ vars.SCREEN_BOT || '1' }}
          # 1 = a PROVISIONAL card on the forming candle,
          # EARLY_ALERT_SECONDS before its close, then one
          # CONFIRMED/CANCELLED line at the close. 0 = close-only
          # cards, which is the late behaviour this removes.
          SCREEN_EARLY: ${{ vars.SCREEN_EARLY || '1' }}
          SCREEN_MAX_DAY: ${{ vars.SCREEN_MAX_DAY || '6' }}
          SCREEN_MIN_SCORE: ${{ vars.SCREEN_MIN_SCORE || '55' }}
          SCREEN_PERSIST_MIN: ${{ vars.SCREEN_PERSIST_MIN || '78' }}
          SCREEN_SLOPE_MIN: ${{ vars.SCREEN_SLOPE_MIN || '0' }}
          SCREEN_SLOPE_BARS: ${{ vars.SCREEN_SLOPE_BARS || '3' }}
          SCREEN_STRUCTURE_MIN: ${{ vars.SCREEN_STRUCTURE_MIN || '60' }}
          SCREEN_STRENGTH_MIN: ${{ vars.SCREEN_STRENGTH_MIN || '55' }}
          SCREEN_LEAD_MAX: ${{ vars.SCREEN_LEAD_MAX || '2.0' }}
          SCREEN_RUN_MAX_R: ${{ vars.SCREEN_RUN_MAX_R || '5.0' }}
          SCREEN_NEAR_HIGH_PCT: ${{ vars.SCREEN_NEAR_HIGH_PCT || '0.20' }}
          SCREEN_COUNTER_PERSIST: ${{ vars.SCREEN_COUNTER_PERSIST || '90' }}
          SCREEN_CAP_PER_SECTOR: ${{ vars.SCREEN_CAP_PER_SECTOR || '2' }}
          SCREEN_COOLDOWN_MIN: ${{ vars.SCREEN_COOLDOWN_MIN || '45' }}
          SCREEN_LAST_ENTRY: ${{ vars.SCREEN_LAST_ENTRY || '14:30' }}
          # Bot 4's own loop stands down while this scan is running (one set of
          # numbers); 0 = it always screens on its own read. 7d frames for the
          # screen's names (EMA9 + pivots seeded), and how long its loop waits for
          # a closed bar to publish before skipping the candle.
          SCREEN_FAILOVER: ${{ vars.SCREEN_FAILOVER || '1' }}
          SCREEN_PERIOD: ${{ vars.SCREEN_PERIOD || '7d' }}
          SCREEN_PUBLISH_WAIT_S: ${{ vars.SCREEN_PUBLISH_WAIT_S || '120' }}
          # How long bot 4 waits for the closed bars (polling once a second) before
          # it judges what the feed has, and how often it re-asks.
          SCREEN_NAME_WAIT_S: ${{ vars.SCREEN_NAME_WAIT_S || '8' }}
          SCREEN_POLL_SECONDS: ${{ vars.SCREEN_POLL_SECONDS || '1' }}
          # 1 = look the incumbent pick up in a per-bar log, so the early pass
          # cannot erase the candle before this one (pick cannot flip inside a
          # candle). Off: 17 Nov it would have held REALTY and lost BANKINDIA.
          PICK_STICKY_LOG: ${{ vars.PICK_STICKY_LOG || '0' }}
          # 0 = a NEUTRAL follow scans only the sector it picked, not every
          # leader after it (each extra sector brings its own 3-entry budget).
          SECTOR_FOLLOW_EXTRAS: ${{ vars.SECTOR_FOLLOW_EXTRAS || '1' }}
          # 1 = also scan the leading sector on the other side of the pick
          # (each sector keeps its own 3-entry budget). 0 = one side only.
          DUAL_PICK: ${{ vars.DUAL_PICK || '1' }}
          # How many names of each picked sector are scanned, ranked by how
          # far they lead it. 0 = every name in the sector.
          SECTOR_TOP_N: ${{ vars.SECTOR_TOP_N || '5' }}
          MIN_TARGET_PCT: ${{ vars.MIN_TARGET_PCT || '0.10' }}
          # EMA9 exit needs a close beyond the smaller of these (0 = old rule).
          EXIT_EMA9_BUFFER_PCT: ${{ vars.EXIT_EMA9_BUFFER_PCT || '0.10' }}
          EXIT_EMA9_BUFFER_R: ${{ vars.EXIT_EMA9_BUFFER_R || '0.25' }}
          # T1 hit moves the stop to entry so a hit target cannot become a loss.
          BREAKEVEN_AFTER_T1: ${{ vars.BREAKEVEN_AFTER_T1 || '1' }}
        run: python -m nse_scanner live --exit-at-close --max-minutes 170

      # A corrupt ledger must not turn into another immutable cache snapshot.
      # Validate and save even if the loop failed or was cancelled: whatever
      # was already sent must be remembered by the next run.
      - name: Validate scanner state
        id: validate
        if: ${{ always() && !inputs.dry_run && hashFiles('state/scan_state.json') != '' }}
        run: python -c 'from nse_scanner.state import load; load()'

      - name: Save updated scanner state
        if: ${{ always() && steps.validate.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: state/scan_state.json
          key: nse-scan-state-${{ steps.ist.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ── The day's raw record, kept so the screen can be REPLAYED ──────────────
      # reports/board-<session>-<bot>.jsonl is every name of every sector, ranked,
      # on every candle — the only input a replay of bot 4 (or of any rule change)
      # needs to reproduce a day exactly. It lives on the runner and used to die
      # with it, which is why 18-20 Nov cannot be re-run. Kept for 30 days, one
      # artifact per run, so a handover does not overwrite the earlier half-day.
      - name: Keep the day's board record (for replay)
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: board-${{ steps.ist.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            state/screen_state.json
          if-no-files-found: warn
          retention-days: 30

      # Only after the state is saved: the successor's guard waits for this run
      # to finish, then restores exactly this snapshot.
      - name: Hand over to a fresh run
        if: ${{ steps.scan.outputs.handoff == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run live-scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          -f handoff=true -f dry_run=${{ inputs.dry_run && 'true' || 'false' }}
