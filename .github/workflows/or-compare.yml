# Opening range: 30 minutes or 15? — MEASUREMENT ONLY.
#
# Replays finished sessions through the same market engine and the same stock
# engine the scanner uses, once per opening-range length, and reports what each
# would have picked and what its entries would have done by the close.
#
# Nothing here alerts, writes the live ledger or changes a knob: `market.OR_MINUTES`
# is patched inside the comparison and restored on the way out. It is dispatched by
# hand, never on a schedule, so it can never run beside a live loop.
#
# 18 Nov is the case it was built for: seven of the twelve names of the sector
# picked at 09:45 had fired between 09:20 and 09:40, inside the thirty-minute range.
# The gate is mom = bar time - 09:15 >= OR, so 30 allows a pick on the 09:45 bar,
# 15 on 09:30, 10 on 09:25 and 5 on 09:20 — try `30,15,10,5` to see the whole ladder.
#
# Inputs
#   or     — opening ranges to compare, in minutes ("30,15" or "30,20,15")
#   dates  — sessions to replay, comma separated (empty = the last `days` weekdays)
#   days   — how many weekdays to replay when `dates` is empty
#
# Output: the report in the run's Summary page and as a downloadable artifact.

name: OR comparison (measurement)
run-name: OR compare ${{ inputs.or }} — ${{ inputs.dates || inputs.days }}

on:
  workflow_dispatch:
    inputs:
      or:
        description: "Opening ranges to compare, minutes, comma separated"
        type: string
        default: "30,15"
      dates:
        description: "Sessions to replay, comma separated YYYY-MM-DD (empty = last N weekdays)"
        type: string
        default: ""
      days:
        description: "Weekdays to replay when dates is empty"
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Replay and compare
        env:
          OR_VALUES: ${{ inputs.or }}
          DATES: ${{ inputs.dates }}
          DAYS: ${{ inputs.days }}
          LOG_LEVEL: INFO
        run: |
          set -euo pipefail
          args=(--or "$OR_VALUES")
          if [ -n "${DATES:-}" ]; then
            args+=(--dates "$DATES")
          else
            args+=(--days "$DAYS")
          fi
          python -m nse_scanner or-compare "${args[@]}" 2>&1 | tee report.md
          # The report is the deliverable: keep the markdown, drop the stderr noise.
          sed -n '/^# Opening range/,$p' report.md > summary.md || cp report.md summary.md

      - name: Report on the run's own Summary page
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: or-compare-${{ github.run_id }}
          path: summary.md
          if-no-files-found: warn

      - name: Nothing was sent, nothing was written
        if: always()
        run: |
          echo "This workflow only reads Yahoo data. It sends no Telegram message and"
          echo "does not read or write the live scanner's ledger."
